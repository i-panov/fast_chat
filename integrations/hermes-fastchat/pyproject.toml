[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fastchat"
version = "0.1.0"
description = "Fast Chat platform adapter for Hermes Agent"
requires-python = ">=3.10"
dependencies = ["fastchat-bot>=0.1.0"]

[project.entry-points."hermes_agent.plugins"]
fastchat = "adapter:register"

[tool.setuptools]
py-modules = ["adapter"]
