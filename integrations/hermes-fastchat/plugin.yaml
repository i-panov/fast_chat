name: fastchat
kind: platform
version: 0.1.0
description: Fast Chat messaging platform adapter for Hermes Agent
author: Fast Chat
license: MIT
requires_env:
  - name: FASTCHAT_BOT_TOKEN
    description: "Bot token from Fast Chat (@root_bot: /newbot)"
    secret: true
optional_env:
  - name: FASTCHAT_BOT_BASE_URL
    description: "Fast Chat server URL"
    password: false
capabilities: []
provides_hooks: []
python_dependencies:
  - "fastchat-bot>=0.1.0"
