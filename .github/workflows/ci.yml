name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Go, TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stored timestamps are compared as text against a UTC sync cursor, so
        # a local-zone value is only detectable outside UTC. The suite passes
        # trivially with TZ=UTC, which is why at least one non-UTC zone is
        # mandatory here.
        tz: ["UTC", "America/New_York", "Asia/Tokyo"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      # Built from source with the same toolchain that compiles the backend: a
      # prebuilt binary from an older Go cannot parse a newer stdlib. Only the
      # UTC leg needs it, since linting does not depend on the time zone.
      - name: Install golangci-lint
        if: matrix.tz == 'UTC'
        run: make backend:lint:install

      - name: Lint
        if: matrix.tz == 'UTC'
        run: make backend:lint
        working-directory: .

      - name: Test
        run: make backend:test
        working-directory: .
        env:
          TEST_TZ: ${{ matrix.tz }}

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: make frontend:lint
        working-directory: .

      - name: Test
        run: make frontend:test
        working-directory: .

      - name: Dead code check
        run: make dead-code
        working-directory: .
        continue-on-error: true

  # The unit tests of the interface replace the peer connection with a stub:
  # only a pair of real browsers shows that the media of a call flows.
  e2e:
    name: End-to-end (calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Playwright starts the backend and the dev server of the interface
      # itself: the browser is the only piece it cannot install on its own.
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Test
        run: make frontend:e2e
        working-directory: .

      - name: Keep the artifacts of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          retention-days: 7
