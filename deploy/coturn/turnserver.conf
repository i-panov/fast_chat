# Fast Chat TURN server. Keep this file out of the web root.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=fastchat
server-name=fastchat-turn
# Do not expose the CLI or allow arbitrary multicast peers.
no-cli
no-multicast-peers
# Relay range; open the same UDP range in the firewall/NAT.
min-port=49160
max-port=49200
# Production behind NAT: set the public address.
# external-ip=<PUBLIC_IP>
# TLS (required for turns: and for restrictive networks).
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# For debugging only:
# verbose
