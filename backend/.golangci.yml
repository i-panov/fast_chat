version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - nakedret
    - tagalign
    - tagliatelle
    - bodyclose
    - noctx
    - contextcheck
    - nilerr
    - nilnil
    - nilnesserr
    - prealloc
    - makezero
    - unconvert
    - copyloopvar
    - predeclared
    - perfsprint
    - gocognit
    - gocyclo
    - cyclop
    - funlen
    - maintidx
    - dupl
    - goconst
    - gocritic
    - nestif
    - varnamelen
    - decorder
    - dupword
    - gosec
    - errname
    - err113
    - errorlint
    - exhaustive
    - forbidigo
    - iface
    - importas
    - interfacebloat
    - intrange
    - ireturn
    - loggercheck
    - musttag
    - nonamedreturns
    - paralleltest
    - recvcheck
    - testifylint
    - thelper
    - usestdlibvars
    - usetesting
    - whitespace
    - unparam
    - wastedassign
    - durationcheck
    - errchkjson
    - canonicalheader
    - dogsled
    - grouper
    - funcorder
    - godot
    - godoclint
    - godox
    - gocheckcompilerdirectives
    - inamedparam
    - iotamixing
    - gomoddirectives
    - goprintffuncname
    - containedctx
    - fatcontext
    - asciicheck
    - bidichk
    - mirror
    - modernize
    - exptostd
    - lll
    - nosprintfhostport
    - reassign
    - sloglint
    - testableexamples
    - tparallel
    - nolintlint

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
      disabled-checks:
        - ifElseChain
        - unnamedResult

    tagliatelle:
      case:
        use-field-name: true
        rules:
          json: camel
          yaml: snake

    gocyclo:
      min-complexity: 25

    gocognit:
      min-complexity: 40

    cyclop:
      max-complexity: 25
      package-average: 0

    funlen:
      lines: 120
      statements: 70

    maintidx:
      under: 20

    nestif:
      min-complexity: 8

    dupl:
      threshold: 100

    lll:
      line-length: 150
      tab-width: 1

    varnamelen:
      max-distance: 5
      min-name-length: 2
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - id
        - ok
        - w
        - r
        - ch
        - db
        - fs

    nakedret:
      max-func-lines: 30

    whitespace:
      multi-if: true
      multi-func: true

    errcheck:
      check-type-assertions: true
      check-blank: true

    errorlint:
      errorf: true
      errorf-multi: true

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use structured logging
        - pattern: ^log\.Fatal.*$
          msg: return errors instead
        - pattern: ^log\.Panic.*$
          msg: return errors instead

    iface:
      enable:
        - identical

    importas:
      no-unaliased: true

    interfacebloat:
      max: 10

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic

    paralleltest:
      ignore-missing-subtests: true

    testifylint:
      enable-all: true

    nolintlint:
      require-explanation: true
      require-specific: true

    errchkjson:
      report-no-exported: true

  exclusions:
    rules:
      - linters:
          - varnamelen
          - goconst
          - gocritic
          - revive
        path: handler/.*\.go
      - linters:
          - revive
        path: main\.go
      - linters:
          - gocritic
        text: "whyNoLint"
      - linters:
          - gocritic
        text: "rangeValCopy"
        path: handler/messages\.go
      - linters:
          - errcheck
          - ineffassign
          - varnamelen
          - paralleltest
          - intrange
          - gosec
          - staticcheck
          - usetesting
          - dupl
          - goconst
          - funlen
          - cyclop
          - unparam
          - lll
          - godox
          - containedctx
        path: .*_test\.go

formatters:
  enable:
    - gofmt
    - goimports
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(fast_chat)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0