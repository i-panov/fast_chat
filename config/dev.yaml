server:
    host: localhost
    port: 8080
    static_dir: ../frontend/dist

database:
    # Local data file. Kept under ./data (mode 0700 at startup) so a reboot
    # does not wipe it like /tmp and other users cannot read it.
    path: ./data/fastchat.db

uploads:
    dir: uploads

cors:
    origin: http://localhost:5173

email:
    debug_mode: true
    allowed_emails: []

federation:
    scheme: http
    key_path: ./data/federation
    # Локальные соседи живут на loopback, а защита от SSRF такие адреса
    # блокирует. В продакшене флаг остаётся выключенным.
    allow_private_addresses: true

ice:
    # Публичный STUN помогает браузеру найти свой внешний адрес.
    stun:
        - "stun:stun.l.google.com:19302"
    # TURN нужен для сетей, где прямое соединение невозможно. Локально он
    # не поднимается: без него звонок работает только внутри одной сети.
    turn: []

push:
    vapid_subject: mailto:admin@fastchat.local

auth:
    token_expiry: 24h
    token_expiry_warning: 5m
