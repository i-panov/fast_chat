[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastchat-bot"
version = "0.1.0"
description = "Python SDK for the Fast Chat Bot API"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyNaCl>=1.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastchat_bot*"]
